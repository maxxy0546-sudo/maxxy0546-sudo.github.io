name: Breakout branch checks

on:
  push:
    branches: [Breakout]
    paths:
      - 'src/**'
      - 'scripts/breakout/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/breakout-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Breakout unit tests
        run: node --test scripts/breakout/breakoutEngine.test.js

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
